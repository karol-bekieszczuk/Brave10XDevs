# .github/workflows/review.yml
name: AI Code Review

on:
  pull_request:
    branches: [master]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: review
        uses: twoj-zespol/ai-reviewer@<sha>
        with:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
